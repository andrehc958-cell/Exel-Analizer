name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token de CI sólo puede leer el repositorio.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falla si alguna dependencia de producción tiene una vulnerabilidad conocida.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
